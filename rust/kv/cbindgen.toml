language = "C"
pragma_once = true
cpp_compat = true
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
header = "/* Copyright (c) 2026 OceanBase. SPDX-License-Identifier: Apache-2.0 */\n/* Generated from the kv crate. DO NOT EDIT. */"

[enum]
prefix_with_name = true

[export]
exclude = ["PAGE_SIZE", "MAX_KEY_SIZE", "MAX_VALUE_SIZE"]
include = [
  "KvCode", "KvStatus", "KvBytes", "KvLimits", "KvCommit", "KvBoundKind", "KvRange",
  "KvStore", "KvSnapshot", "KvCursor", "KvValueVisitor", "KvRowVisitor", "KvWriteCallback",
  "kv_open", "kv_close", "kv_get", "kv_snapshot", "kv_snapshot_close", "kv_snapshot_get",
  "kv_scan", "kv_scan_prefix", "kv_cursor_next", "kv_cursor_close",
  "kv_write", "kv_tx_get", "kv_tx_put", "kv_tx_delete", "kv_tx_scan",
]
