name: "Build base"

inputs:
  save_cache:
    description: 'retained for compatibility with existing callers'
    required: true
  os:
    description: 'retained for compatibility with existing callers'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    # Fail fast: catch a crate that does not compile before the C++ build.
    # ABI drift is caught by rust-checks' header drift check (nio.h is
    # cbindgen-generated), not by tests here.
    - name: Rust unit tests
      shell: bash
      working-directory: rust
      run: cargo test --workspace

    - name: Initialize release build
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        ./build.py init
        export PATH="$PWD/deps/3rd/usr/local/oceanbase/devtools/bin:$PATH"
        echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

    - name: Build release binary
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        python3 ./build.py build --jobs=4 //src/observer:seekdb
        test -x build_bazel/bin/src/observer/seekdb
